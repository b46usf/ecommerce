  /webhooks/biteship:
    post:
      tags:
      - Webhooks
      operationId: receiveBiteshipWebhook
      summary: Ingress event Biteship
      description: Tidak memakai session/CSRF. Jangan menganggap endpoint publik sebagai bukti keaslian. Verifikasi
        autentikasi yang didukung akun; bila belum tersedia, payload hanya hint untuk verifikasi order lewat API
        server-side. Cocokkan provider account/order, dedupe, inbox durable. Tidak boleh menandai delivered, mengubah
        ledger atau menagih dari payload tak terverifikasi. Unknown order masuk quarantine. Event valid tersimpan
        ->200; storage gagal ->503. Tidak mengarang header signature provider.
      responses:
        '200':
          description: Berhasil
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID
            Cache-Control:
              schema:
                type: string
              example: no-store
              description: Wajib untuk data privat; publik dapat memakai kebijakan cache terpisah.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
