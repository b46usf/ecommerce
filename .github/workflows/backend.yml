name: Backend checks
on:
  push:
    paths: ['backend/**', 'docs/Marketplace-API-OpenAPI-v0.1.yaml', 'docs/ERD-Struktur-Tabel-Marketplace-v0.1.md', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'docs/Marketplace-API-OpenAPI-v0.1.yaml', 'docs/ERD-Struktur-Tabel-Marketplace-v0.1.md', '.github/workflows/backend.yml']
permissions:
  contents: read
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: ['mysql:8.0', 'mariadb:10.4']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: marketplace_ci_test
          MYSQL_USER: marketplace_ci
          MYSQL_PASSWORD: ci-app-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: --health-cmd="valkey-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql://marketplace_ci:ci-app-password@127.0.0.1:3306/marketplace_ci_test
      TEST_DATABASE_URL: mysql://marketplace_ci:ci-app-password@127.0.0.1:3306/marketplace_ci_test
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ci-session-key-never-used-outside-isolated-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Allow trigger creation in the isolated CI database
        run: mysql -h 127.0.0.1 -u root -e "SET GLOBAL log_bin_trust_function_creators = 1"
        env:
          MYSQL_PWD: ci-root-password
      - run: npm run check
      - run: npm run db:erd:check
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t marketplace-backend:ci .
