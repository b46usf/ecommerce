openapi: 3.0.3
info:
  title: Marketplace Multi-vendor Web API
  version: 0.1.0
  description: 'Kontrak API aplikasi marketplace multi-vendor, berdasarkan SRS v0.2 dan ERD v0.1. Belum ada backend
    atau server yang di-deploy. URL relatif /api/v1 adalah rancangan; ganti server saat implementasi.


    ## Konvensi

    Uang integer IDR, waktu RFC3339 UTC, ID UUID. Nilai maksimum API dibatasi safe integer JavaScript; database
    dapat memakai BIGINT. Input dengan field tambahan ditolak kecuali attributes/snapshot/provider payload. Total
    harga dan pajak selalu dihitung server. Error memakai error.code/message/request_id/details. List memakai cursor
    opaque dan limit 1..100.


    ## Autentikasi web

    Cookie session HttpOnly Secure, SameSite sesuai deployment, HTTPS. GET /auth/csrf menerbitkan pre-session dan
    token CSRF; setiap mutation browser, termasuk login/register, mengirim X-CSRF-Token. Rotasi session dan CSRF
    setelah login; token CSRF baru diambil kembali. Validasi Origin/Referer sebagai pertahanan tambahan. GET privat
    memerlukan cookie; mutation privat memerlukan cookie DAN CSRF. Dokumentasi Swagger hosted lintas origin mungkin
    tidak dapat mengirim cookie; gunakan Swagger UI same-origin atau klien API saat backend tersedia.


    ## Otorisasi

    x-roles adalah metadata implementasi, bukan OAuth scope yang otomatis ditegakkan Swagger. BUYER_OWNER berarti
    pengelola buyer_account_id; STORE_OWNER/CATALOG/FULFILLMENT terikat storeId, bukan global. FINANCE_APPROVER
    berbeda aktor dari pengaju payout. Semua ID diperiksa ownership; 404 boleh dipakai untuk menyembunyikan objek
    lintas tenant. Jangan mengekspos snapshot kontak vendor lain, NIK/NPWP atau server key.


    ## Idempotensi dan konkurensi

    Mutation finansial dan create resource memakai Idempotency-Key (UUID disarankan), scope actor+operation+key.
    Payload sama mengembalikan status/body pertama; payload berbeda 409 IDEMPOTENCY_CONFLICT. IN_PROGRESS mengembalikan
    409 REQUEST_IN_PROGRESS plus Retry-After. Retensi transport usulan 7 hari; business references permanen tetap
    unik. Akses diperiksa ulang sebelum replay. Mutation resource berversi memakai If-Match integer row_version
    dalam tanda kutip; stale 412, header hilang 428. Jangan memakai wildcard. ETag respons adalah row_version.


    ## Asinkron

    202 bukan bukti pembayaran/booking/refund selesai. AsyncOperation.id memetakan outbox_events.id dan state adalah
    proyeksi worker, bukan tabel tambahan wajib. Poll status_url memakai session sampai SUCCEEDED/FAILED/REVIEW.
    UNKNOWN provider tetap menahan tagihan/reservasi finansial. Retry efek eksternal setelah rekonsiliasi, tidak
    membuat ID bisnis baru.


    ## Alur checkout

    Ambil rates -> preview -> confirm -> create payment session -> poll operation -> get payment attempt -> tampilkan
    Snap -> poll order. Confirm menyimpan order/reservasi/outbox; sesi dibentuk idempoten oleh endpoint payment-sessions
    dan outbox yang sama. Preview token signed/opaque terikat buyer, cart version, alamat, SKU/qty, shipping quotes,
    total, kebijakan dan expiry. Revalidasi token/stock/rates sebelum tagihan; perubahan menolak dengan 409 dan
    perlu preview baru. Ganti metode harus menutup attempt lama terlebih dahulu.


    ## Batas

    VA, QRIS dan e-wallet aktif saja; tidak COD/paylater/kartu kredit. MDR gateway bukan surcharge pembeli. Tax/fee
    config berasal dari aturan SRS, bukan angka tetap dalam endpoint. Subscription/ads/booster dan payout API otomatis
    di luar MVP. Payout di sini pencatatan transfer manual yang diverifikasi. Backend Midtrans/Biteship SDK/API
    merupakan adapter internal, tidak diproxy mentah ke browser.


    ## Sumber

    [OpenAPI 3.0.3](https://spec.openapis.org/oas/v3.0.3.html), [Midtrans webhook](https://docs.midtrans.com/docs/https-notification-webhooks),
    [Biteship events](https://biteship.com/id/docs/api/webhook/overview). Payload provider adalah schema minimum
    toleran; backend wajib menangani field baru/status tidak dikenal sebagai review, bukan menganggap sukses.

    '
servers:
- url: /api/v1
  description: Rancangan base path; belum server aktif
security:
- SessionCookie: []
tags:
- name: Auth
- name: Buyer
- name: Catalog
- name: Cart
- name: Quotes
- name: Shipping
- name: Checkout
- name: Orders
- name: Payments
- name: Cases
- name: Refunds
- name: Vendor
- name: Vendor Catalog
- name: Inventory
- name: Vendor Quotes
- name: Vendor Orders
- name: Finance
- name: Documents
- name: Admin
- name: Tax
- name: Operations
- name: Notifications
- name: Webhooks
paths:
  /auth/csrf:
    get:
      tags:
      - Auth
      operationId: getCsrf
      summary: Ambil CSRF dan pre-session
      description: Ambil CSRF dan pre-session
      responses:
        '200':
          description: Berhasil
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID
            Cache-Control:
              schema:
                type: string
              example: no-store
              description: Wajib untuk data privat; publik dapat memakai kebijakan cache terpisah.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-roles:
      - PUBLIC
      security: []
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Daftar pengguna
      description: Membuat akun individu dan mengirim verifikasi. Password tidak dikembalikan.
      responses:
        '201':
          description: Resource terbentuk
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-roles:
      - PUBLIC
      security:
      - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Login session web
      description: Validasi pre-session CSRF. Rotasi session; respons Set-Cookie HttpOnly Secure. Ambil CSRF baru
        setelah login.
      responses:
        '200':
          description: Berhasil
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID
            Set-Cookie:
              schema:
                type: string
              description: marketplace_session; HttpOnly; Secure; SameSite sesuai deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-roles:
      - PUBLIC
      security:
      - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
