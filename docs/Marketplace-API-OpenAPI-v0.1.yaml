components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: marketplace_session
      description: Session server-side; jangan isi server key provider.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token dari GET /auth/csrf, terikat pre-session/session.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
                additionalProperties: false
                required:
                - code
                - message
          additionalProperties: false
          required:
          - code
          - message
          - request_id
      additionalProperties: false
      required:
      - error
    Message:
      type: object
      properties:
        message:
          type: string
      additionalProperties: false
      required:
      - message
    Reason:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      additionalProperties: false
      required:
      - reason
    AsyncOperation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - QUEUED
          - PROCESSING
          - SUCCEEDED
          - FAILED
          - REVIEW
        status_url:
          type: string
        result_type:
          type: string
          nullable: true
        result_id:
          type: string
          format: uuid
          nullable: true
        error:
          type: string
          nullable: true
      additionalProperties: false
      required:
      - id
      - state
      - status_url
      example:
        id: 10000000-0000-4000-8000-000000000008
        state: QUEUED
        status_url: /api/v1/operations/10000000-0000-4000-8000-000000000008
        result_type: null
        result_id: null
        error: null
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        row_version:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        email_verified:
          type: boolean
        admin_roles:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - id
      - row_version
      - name
      - email
      - phone
      - avatar_url
      - email_verified
      - admin_roles
    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          nullable: true
          minLength: 7
          maxLength: 32
          pattern: '^\+?[0-9 .()\-]{7,32}$'
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
      additionalProperties: false
      required:
      - current_password
      - new_password
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
      additionalProperties: false
      required:
      - email
      - password
      example:
        email: pembeli@example.com
        password: contoh-password-aman
    Register:
      type: object
      properties:
        name:
          type: string
