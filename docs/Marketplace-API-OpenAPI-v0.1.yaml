            schema:
              $ref: '#/components/schemas/ResetPassword'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Cabut session
      description: Cabut session
      responses:
        '204':
          description: Berhasil tanpa body
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID
            Cache-Control:
              schema:
                type: string
              example: no-store
              description: Wajib untuk data privat; publik dapat memakai kebijakan cache terpisah.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-roles:
      - AUTHENTICATED
      security:
      - SessionCookie: []
        CsrfToken: []
  /me:
    get:
      tags:
      - Auth
      operationId: getMe
      summary: Profil login
      description: Profil login
      responses:
        '200':
          description: Berhasil
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlation ID
            Cache-Control:
              schema:
                type: string
              example: no-store
              description: Wajib untuk data privat; publik dapat memakai kebijakan cache terpisah.
          content:
